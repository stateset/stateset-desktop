name: E2E Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright dependencies
        run: npx playwright install --with-deps

      - name: Typecheck desktop tests
        run: npm run typecheck:e2e

      - name: Run E2E tests
        run: xvfb-run -a npm run test:e2e
        env:
          CI: true

      - name: Build Linux bundle
        run: ./node_modules/.bin/electron-builder --dir --linux --publish never --config.directories.output=dist/packaged-smoke

      - name: Verify Linux bundle startup
        run: xvfb-run -a npm run test:e2e:bundle
        env:
          CI: true
          STATESET_PACKAGED_EXECUTABLE: dist/packaged-smoke/linux-unpacked/stateset-desktop

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
            e2e/*-results.json
