name: Build and Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release'
        required: false
        type: boolean
        default: true

env:
  NODE_VERSION: '22'
  RELEASE_REQUESTED: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true) }}

jobs:
  # Run tests first
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Verify release asset validation
        run: npm run test:release-assets

      - name: Verify computer chat acceptance harness
        run: npm run test:computer-chat:harness

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              const rows = ['lines', 'statements', 'functions', 'branches']
                .map((k) => '| ' + k + ' | ' + t[k].pct + '% (' + t[k].covered + '/' + t[k].total + ') |')
                .join('\n');
              require('fs').appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                '## Unit Test Coverage\n\n| Metric | Coverage |\n|---|---|\n' + rows + '\n'
              );
            "
          fi

      - name: Build Electron (tsc)
        run: npm run build:electron

      - name: Build Renderer (Vite)
        run: npm run build:vite

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Run E2E on all events (PRs included) to catch regressions before merge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright dependencies
        run: npx playwright install --with-deps

      - name: Typecheck desktop tests
        run: npm run typecheck:e2e

      - name: Run E2E tests
        run: xvfb-run -a npm run test:e2e
        env:
          CI: true
          STATESET_ENGINE_API_KEY: ${{ secrets.STATESET_ENGINE_API_KEY }}
          STATESET_SANDBOX_API_KEY: ${{ secrets.STATESET_SANDBOX_API_KEY }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results

  # Build for macOS
  build-macos:
    needs: [test, e2e]
    runs-on: macos-latest
    if: ${{ always() && (github.event_name == 'pull_request' || needs.e2e.result == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code signing
        id: signing
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "has_certs=true" >> $GITHUB_OUTPUT
          else
            echo "has_certs=false" >> $GITHUB_OUTPUT
          fi
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}

      - name: Require signing and notarization credentials for releases
        if: env.RELEASE_REQUESTED == 'true'
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Release requires $name. Configure the macOS signing and notarization secrets."
              exit 1
            fi
          done
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Electron app (signed)
        if: steps.signing.outputs.has_certs == 'true'
        run: npm run build:mac -- --publish never --config.forceCodeSigning=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Electron app (unsigned)
        if: steps.signing.outputs.has_certs != 'true'
        run: npm run build:mac -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify release signatures and notarization tickets
        if: env.RELEASE_REQUESTED == 'true'
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            found=$((found + 1))
          done < <(find release -maxdepth 3 -name '*.app' -type d -print0)
          test "$found" -gt 0

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  # Build for Windows
  build-windows:
    needs: [test, e2e]
    runs-on: windows-latest
    if: ${{ always() && (github.event_name == 'pull_request' || needs.e2e.result == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code signing
        id: signing
        shell: bash
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            echo "has_certs=true" >> $GITHUB_OUTPUT
          else
            echo "has_certs=false" >> $GITHUB_OUTPUT
          fi
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

      - name: Require code signing credentials for releases
        if: env.RELEASE_REQUESTED == 'true'
        shell: bash
        run: |
          if [ -z "$WIN_CSC_LINK" ] || [ -z "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "::error::Release requires WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD signing secrets."
            exit 1
          fi
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build Electron app (signed)
        if: steps.signing.outputs.has_certs == 'true'
        run: npm run build:win -- --publish never --config.forceCodeSigning=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Strip signing config for unsigned build
        if: steps.signing.outputs.has_certs != 'true'
        shell: bash
        run: node -e "const fs=require('fs'), p=JSON.parse(fs.readFileSync('package.json','utf8')); delete p.build.win.signtoolOptions; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Build Electron app (unsigned)
        if: steps.signing.outputs.has_certs != 'true'
        run: npm run build:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify release installer signatures
        if: env.RELEASE_REQUESTED == 'true'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter *.exe)
          if ($installers.Count -eq 0) { throw 'No Windows installers found' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid installer signature: $($installer.Name)" }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  # Build for Linux
  build-linux:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event_name == 'pull_request' || needs.e2e.result == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install desktop smoke test dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify packaged Linux startup and restart
        run: xvfb-run -a npm run test:e2e:bundle
        env:
          CI: true
          STATESET_PACKAGED_EXECUTABLE: release/linux-unpacked/stateset-desktop

      - name: Verify Linux installer contents, updater metadata and startup
        run: xvfb-run -a npm run test:e2e:distribution
        env:
          CI: true
          STATESET_LINUX_ARTIFACTS_DIR: release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: error

  # Create GitHub Release (only on tags or manual trigger)
  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install release validation dependencies
        run: npm ci

      - name: Get and validate release version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const metadata = JSON.parse(readFileSync('package.json', 'utf8'));
          const version = process.env.RELEASE_REF.startsWith('refs/tags/v')
            ? process.env.RELEASE_REF.slice('refs/tags/v'.length)
            : metadata.version;
          assert.equal(version, metadata.version, 'Release tag must match package.json');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Validate updater manifests and collect release files
        id: collect_release_files
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/collect-release-assets.mjs artifacts release-assets "$RELEASE_VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: StateSet Desktop v${{ steps.version.outputs.version }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
          generate_release_notes: true
          files: ${{ steps.collect_release_files.outputs.files }}
          fail_on_unmatched_files: true
          body: |
            ## StateSet Desktop v${{ steps.version.outputs.version }}

            Autonomous AI agents for customer service operations.

            ### Downloads

            Choose the matching architecture from the assets below:

            | Platform | Package |
            |----------|---------|
            | **macOS (Intel / Apple Silicon)** | `.dmg` installer or `.zip` |
            | **Windows (x64 / ARM64)** | `.exe` installer; the x64 portable build includes `-portable` in its name |
            | **Linux** | `.AppImage` or `.deb` |

            `SHA256SUMS` contains checksums for the installers and updater manifests.

            ### Installation

            **macOS**: Download the .dmg file, open it, and drag StateSet to your Applications folder.

            **Windows**: Download and run the .exe installer.

            **Linux**: Download the .AppImage, make it executable (`chmod +x`), and run it. Or install the .deb package.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Update latest.yml for auto-updater (after release)
  update-latest:
    needs: release
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    steps:
      - name: Trigger auto-updater manifest update
        run: |
          echo "Auto-updater will use GitHub releases automatically"
          echo "electron-updater reads from the latest GitHub release"
